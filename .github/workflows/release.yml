name: Build and Release

# Trigger only when a version tag is pushed
on:
  push:
    tags:
      - 'v*'  # e.g., v1.2.3

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.0.2

      - name: Install MFC/ATL C++ components
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsInstallPath = & $vswhere -latest -property installationPath
          Write-Host "VS install path: $vsInstallPath"

          function Install-Mfc {
            $proc = Start-Process -FilePath $installer -ArgumentList @(
              "modify",
              "--installPath", "`"$vsInstallPath`"",
              "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC",
              "--quiet", "--norestart"
            ) -NoNewWindow -Wait -PassThru
            return $proc.ExitCode
          }

          $exitCode = Install-Mfc
          Write-Host "vs_installer exit code: $exitCode"
          if ($exitCode -ne 0 -and $exitCode -ne 3010) {
            throw "vs_installer failed with exit code $exitCode"
          }

          $verify = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          if (-not $verify) {
            Write-Host "MFC/ATL not detected after first attempt, retrying once..."
            $exitCode = Install-Mfc
            Write-Host "vs_installer retry exit code: $exitCode"
            if ($exitCode -ne 0 -and $exitCode -ne 3010) {
              throw "vs_installer retry failed with exit code $exitCode"
            }
            $verify = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.ATLMFC -property installationPath
          }

          if (-not $verify) {
            throw "MFC/ATL component still not detected by vswhere after install attempts."
          }
          Write-Host "MFC/ATL component confirmed at: $verify"

      - name: Install MFC/ATL for the pinned v143 toolset
        shell: pwsh
        run: |
          $vsInstallPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          $toolsetsRoot = Join-Path $vsInstallPath "VC\Tools\MSVC"

          # v143 (VS2022-family) toolsets are versioned 14.30-14.4x. Pick the newest one in that range
          # rather than hardcoding an exact build number, since the runner image updates over time.
          $v143Dir = Get-ChildItem $toolsetsRoot -Directory | Where-Object {
            $parts = $_.Name -split '\.'
            $parts.Count -ge 2 -and [int]$parts[0] -eq 14 -and [int]$parts[1] -ge 30 -and [int]$parts[1] -le 49
          } | Sort-Object Name -Descending | Select-Object -First 1

          if (-not $v143Dir) {
            Write-Host "Toolset directories present:"
            Get-ChildItem $toolsetsRoot -Directory | ForEach-Object { Write-Host " - $($_.Name)" }
            throw "Could not find a v143-family (14.30-14.4x) MSVC toolset directory under $toolsetsRoot"
          }

          $toolsetDir = $v143Dir.Name
          $toolsetKey = $toolsetDir.Substring(0, $toolsetDir.LastIndexOf('.'))
          $atlmfcPath = Join-Path $v143Dir.FullName "atlmfc\include"
          Write-Host "v143 toolset directory: $toolsetDir (key: $toolsetKey)"

          if (Test-Path $atlmfcPath) {
            Write-Host "MFC/ATL already present at $atlmfcPath"
          } else {
            Write-Host "MFC/ATL missing for toolset $toolsetDir. Fetching VS channel manifest to find the exact component id..."
            $channel = Invoke-RestMethod "https://aka.ms/vs/18/stable/channel"
            $manifestItem = $channel.channelItems |
              Where-Object { $_.type -eq "Manifest" -and $_.id -eq "Microsoft.VisualStudio.Manifests.VisualStudio" } |
              Select-Object -First 1
            $manifestUrl = $manifestItem.payloads[0].url
            $manifest = Invoke-RestMethod $manifestUrl

            $candidates = $manifest.packages |
              Where-Object { $_.id -match "(?i)^Microsoft\.VisualStudio\.Component\.VC\..*MFC" } |
              Select-Object -ExpandProperty id -Unique | Sort-Object
            Write-Host "Candidate MFC component ids in manifest:"
            $candidates | ForEach-Object { Write-Host " - $_" }

            $target = $candidates | Where-Object { $_ -match [Regex]::Escape($toolsetKey) } | Select-Object -First 1
            if (-not $target) {
              throw "No MFC component id matching toolset key '$toolsetKey' found in the manifest. See candidates above."
            }

            Write-Host "Installing $target ..."
            $proc = Start-Process -FilePath $installer -ArgumentList @(
              "modify", "--installPath", "`"$vsInstallPath`"",
              "--add", $target,
              "--quiet", "--norestart"
            ) -NoNewWindow -Wait -PassThru
            Write-Host "vs_installer exit code: $($proc.ExitCode)"
            if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
              throw "Install of $target failed with exit code $($proc.ExitCode)"
            }
          }

          if (-not (Test-Path $atlmfcPath)) {
            throw "atlmfc still missing at $atlmfcPath after install attempt."
          }
          Write-Host "Confirmed: $atlmfcPath exists."

      - name: Build C++ Project
        run: |
          $version = "${{ env.VERSION }}" -replace '^v', ''
          msbuild /m /p:Configuration=Release /p:PluginVersion="$version" /p:Contributors="TBD" euroscope-bridge /p:Platform=x86

      - name: Build Gradle Project
        run: |
          cd aman-dman-client
          $version = "${{ env.VERSION }}" -replace '^v', ''
          .\gradlew.bat -Pversion="$version" shadowJar

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p artifacts/config
          cp euroscope-bridge/Release/*.dll artifacts/
          cp aman-dman-client/build/libs/*.jar artifacts/
          cp -r aman-dman-client/config/* artifacts/config/
          powershell -Command "Compress-Archive -Path artifacts\* -DestinationPath aman-dman-${{ env.VERSION }}.zip"

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          files: aman-dman-${{ env.VERSION }}.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AMAN-DMAN-${{ env.VERSION }}
          path: aman-dman-${{ env.VERSION }}.zip